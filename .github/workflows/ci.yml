name: Forge Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  acceptance:
    name: acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Show Go Version
        run: go version

      - name: Verify Dependency Metadata
        run: go mod tidy

      - name: Check Dependency Cleanliness
        run: git diff --exit-code -- go.mod go.sum

      - name: List Packages
        run: go list ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test ./... -count=1

      - name: Build Packages
        run: go build ./...

  race:
    name: race (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Show Go Version
        run: go version

      - name: Run Race Tests
        run: go test -race ./pkg/compiler ./runtime ./internal/cli -count=1
