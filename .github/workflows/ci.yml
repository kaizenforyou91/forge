name: Forge Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Show Go Version
        run: go version

      - name: Show Repository Structure
        run: |
          pwd
          find .

      - name: Download Dependencies
        run: go mod tidy

      - name: List Packages
        run: go list ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test ./... -v